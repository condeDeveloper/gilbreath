name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: As primeiras linhas do triangulo
        run: mvn -B -ntp -q exec:java -Dexec.args="triangulo"

      - name: Quantas linhas aguentam
        run: mvn -B -ntp -q exec:java -Dexec.args="escala"

      - name: O mesmo em outras sequencias
        run: mvn -B -ntp -q exec:java -Dexec.args="outras"

      - name: Os dois caminhos
        run: mvn -B -ntp -q exec:java -Dexec.args="juiz"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports

  fundo:
    # Duzentos mil primos: o triangulo e quadratico, entao isto leva uns vinte
    # segundos. O job confere a propria medida e quebra se ela mudar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Varredura com duzentos mil primos
        run: mvn -B -ntp -q compile exec:java -Dexec.args="fundo"
